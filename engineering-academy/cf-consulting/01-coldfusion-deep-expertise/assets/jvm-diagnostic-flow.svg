<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">JVM memory and latency diagnostic decision path</title>
  <desc id="desc">A decision flow starts with a LearnSphere memory or latency alert, checks process memory limits, correlation with garbage collection pauses, and the post-GC heap baseline, then directs investigation toward native memory, allocation and GC, blocked dependencies, or retained objects.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>.title{font:700 28px Arial,sans-serif;fill:#0f172a}.head{font:700 17px Arial,sans-serif;fill:#0f172a}.body{font:14px Arial,sans-serif;fill:#334155}.small{font:700 13px Arial,sans-serif;fill:#475569}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="title">Evidence-Driven JVM Diagnosis</text>
  <rect x="435" y="66" width="330" height="64" rx="32" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="92" text-anchor="middle" class="head">LearnSphere alert</text><text x="600" y="114" text-anchor="middle" class="body">High memory or slow requests</text>
  <path d="M600 130V164" class="line"/>
  <polygon points="600,165 790,225 600,285 410,225" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="216" text-anchor="middle" class="head">Process near host or</text><text x="600" y="239" text-anchor="middle" class="head">container memory limit?</text>
  <path d="M410 225H235V298" class="line"/><text x="315" y="212" class="small">YES</text>
  <rect x="70" y="300" width="330" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="235" y="328" text-anchor="middle" class="head">Compare all process memory</text><text x="235" y="351" text-anchor="middle" class="body">Heap, stacks, direct/native memory,</text><text x="235" y="372" text-anchor="middle" class="body">agents, OS headroom, and swap</text>
  <path d="M600 285V322" class="line"/><text x="614" y="307" class="small">NO / NEXT</text>
  <polygon points="600,323 790,383 600,443 410,383" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="374" text-anchor="middle" class="head">Latency aligned with</text><text x="600" y="397" text-anchor="middle" class="head">GC pauses?</text>
  <path d="M410 383H235V456" class="line"/><text x="315" y="370" class="small">YES</text>
  <rect x="70" y="458" width="330" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="235" y="486" text-anchor="middle" class="head">Analyze allocation and GC</text><text x="235" y="509" text-anchor="middle" class="body">Pause cause, frequency, duration,</text><text x="235" y="530" text-anchor="middle" class="body">reclaimed space, and live set</text>
  <path d="M790 383H965V456" class="line"/><text x="866" y="370" class="small">NO</text>
  <rect x="800" y="458" width="330" height="90" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="965" y="486" text-anchor="middle" class="head">Inspect other bottlenecks</text><text x="965" y="509" text-anchor="middle" class="body">Thread dumps, pool waits, SQL,</text><text x="965" y="530" text-anchor="middle" class="body">remote calls, CPU, and I/O</text>
  <path d="M600 443V480" class="line"/>
  <polygon points="600,480 750,530 600,580 450,530" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="600" y="522" text-anchor="middle" class="head">Post-GC baseline</text><text x="600" y="545" text-anchor="middle" class="head">keeps rising?</text>
  <path d="M450 530H420V608H325" class="line"/><text x="420" y="516" class="small">YES</text>
  <text x="310" y="614" text-anchor="middle" class="head">Find retained types and paths to GC roots</text>
  <path d="M750 530H780V608H895" class="line"/><text x="760" y="516" class="small">NO</text>
  <text x="900" y="614" text-anchor="middle" class="head">Check allocation pressure or valid growth</text>
</svg>
