<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">JVM process memory map for LearnSphere</title>
  <desc id="desc">The JVM process is divided into Java heap and memory outside the heap. Heap shows young and old generations. Outside-heap memory shows metaspace, code cache, thread stacks, and native memory.</desc>
  <defs><style>.title{font:700 28px Arial,sans-serif;fill:#0f172a}.head{font:700 21px Arial,sans-serif;fill:#0f172a}.sub{font:700 17px Arial,sans-serif;fill:#0f172a}.body{font:14px Arial,sans-serif;fill:#334155}</style></defs>
  <rect width="1100" height="650" fill="#f8fafc"/>
  <text x="550" y="42" text-anchor="middle" class="title">LearnSphere JVM Process Memory</text>
  <rect x="45" y="70" width="1010" height="535" rx="18" fill="#fff" stroke="#475569" stroke-width="3"/>
  <text x="70" y="106" class="head">JVM process</text>
  <rect x="75" y="130" width="565" height="430" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="100" y="168" class="head">Java heap — GC-managed objects</text>
  <rect x="105" y="195" width="505" height="182" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="228" class="sub">Young generation</text>
  <rect x="135" y="248" width="210" height="90" rx="9" fill="#bfdbfe" stroke="#60a5fa"/>
  <text x="240" y="281" text-anchor="middle" class="sub">Eden</text><text x="240" y="307" text-anchor="middle" class="body">New short-lived objects</text>
  <rect x="365" y="248" width="215" height="90" rx="9" fill="#bfdbfe" stroke="#60a5fa"/>
  <text x="472" y="281" text-anchor="middle" class="sub">Survivor regions</text><text x="472" y="307" text-anchor="middle" class="body">Objects surviving young GC</text>
  <rect x="105" y="400" width="505" height="125" rx="12" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
  <text x="130" y="437" class="sub">Old generation</text>
  <text x="130" y="467" class="body">Longer-lived queries, CFCs, sessions, application data, caches</text>
  <text x="130" y="493" class="body">Exact physical layout depends on the selected garbage collector.</text>
  <rect x="670" y="130" width="355" height="430" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="695" y="168" class="head">Outside the Java heap</text>
  <rect x="700" y="198" width="295" height="66" rx="9" fill="#ffedd5" stroke="#fb923c"/>
  <text x="720" y="224" class="sub">Metaspace</text><text x="720" y="247" class="body">Loaded class metadata</text>
  <rect x="700" y="281" width="295" height="66" rx="9" fill="#ffedd5" stroke="#fb923c"/>
  <text x="720" y="307" class="sub">JIT code cache</text><text x="720" y="330" class="body">Compiled machine code</text>
  <rect x="700" y="364" width="295" height="66" rx="9" fill="#ffedd5" stroke="#fb923c"/>
  <text x="720" y="390" class="sub">Thread stacks</text><text x="720" y="413" class="body">One per thread; calls and local state</text>
  <rect x="700" y="447" width="295" height="78" rx="9" fill="#ffedd5" stroke="#fb923c"/>
  <text x="720" y="473" class="sub">Direct/native memory</text><text x="720" y="496" class="body">Buffers, sockets, agents, libraries, JVM</text>
  <text x="550" y="632" text-anchor="middle" class="body">Process memory can be high even when the Java heap is healthy.</text>
</svg>
