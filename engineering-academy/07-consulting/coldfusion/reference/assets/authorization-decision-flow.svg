<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="510" viewBox="0 0 1150 510" role="img" aria-labelledby="title desc">
  <title id="title">Server-side authorization decision flow for a LearnSphere resource</title>
  <desc id="desc">A request is authenticated, checked for permission, checked for resource ownership or tenant boundary, and either allowed with an audit event or denied safely with logging.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>.title{font:700 27px Arial,sans-serif;fill:#0f172a}.head{font:700 16px Arial,sans-serif;fill:#0f172a}.body{font:14px Arial,sans-serif;fill:#334155}.small{font:700 13px Arial,sans-serif;fill:#475569}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1150" height="510" fill="#f8fafc"/>
  <text x="575" y="40" text-anchor="middle" class="title">LearnSphere Authorization: Deny Unless Every Check Passes</text>
  <rect x="35" y="170" width="160" height="70" rx="35" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="199" text-anchor="middle" class="head">Request</text><text x="115" y="220" text-anchor="middle" class="body">certificate 19</text>
  <path d="M195 205H246" class="line"/>
  <polygon points="340,125 435,205 340,285 245,205" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="340" y="198" text-anchor="middle" class="head">Authenticated</text><text x="340" y="219" text-anchor="middle" class="head">identity?</text>
  <path d="M435 205H486" class="line"/><text x="450" y="190" class="small">YES</text>
  <polygon points="580,125 675,205 580,285 485,205" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="580" y="198" text-anchor="middle" class="head">Required</text><text x="580" y="219" text-anchor="middle" class="head">permission?</text>
  <path d="M675 205H726" class="line"/><text x="690" y="190" class="small">YES</text>
  <polygon points="820,115 925,205 820,295 715,205" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="820" y="190" text-anchor="middle" class="head">Owns resource or</text><text x="820" y="212" text-anchor="middle" class="head">authorized tenant/role?</text><text x="820" y="235" text-anchor="middle" class="body">Checked server-side</text>
  <path d="M925 205H976" class="line"/><text x="940" y="190" class="small">YES</text>
  <rect x="975" y="170" width="145" height="70" rx="35" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1048" y="199" text-anchor="middle" class="head">Allow action</text><text x="1048" y="220" text-anchor="middle" class="body">and audit outcome</text>
  <path d="M340 285V368H580" class="line"/><text x="352" y="320" class="small">NO</text>
  <path d="M580 285V368" class="line"/><text x="592" y="320" class="small">NO</text>
  <path d="M820 295V368H580" class="line"/><text x="832" y="330" class="small">NO</text>
  <rect x="455" y="368" width="250" height="92" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="580" y="399" text-anchor="middle" class="head">Deny safely</text><text x="580" y="422" text-anchor="middle" class="body">Return 401/403/404 as designed;</text><text x="580" y="444" text-anchor="middle" class="body">log a safe event and trace ID</text>
  <text x="575" y="493" text-anchor="middle" class="body">Client-side hiding, URL secrecy, and a valid record ID are never authorization.</text>
</svg>
