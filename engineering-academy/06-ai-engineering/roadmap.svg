<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1250" viewBox="0 0 900 1250" role="img" aria-labelledby="title description" font-family="Inter, Segoe UI, Arial, sans-serif">
  <title id="title">AI Engineering roadmap</title>
  <desc id="description">Ten stages from product fit and requirements to cost, performance and operations. Each stage extends the synthetic support assistant.</desc>
  <rect x="1" y="1" width="898" height="1248" rx="18" fill="#FFFFFF" stroke="#DCEAF1" stroke-width="2"/>
  <text x="42" y="52" font-size="13" font-weight="700" fill="#00A8C7" letter-spacing="1.5">TECHVERSANT ENGINEERING ACADEMY</text>
  <text x="42" y="96" font-size="32" font-weight="700" fill="#0B334C">AI Engineering</text>
  <text x="42" y="125" font-size="15" fill="#506575">Build, evaluate, secure and operate an AI-enabled support feature.</text>
  <line x1="450" y1="164" x2="450" y2="1160" stroke="#A8DCE8" stroke-width="3"/>
  <g font-size="17" font-weight="700" fill="#0B334C">
    <rect x="64" y="154" width="772" height="78" rx="15" fill="#EAF8FB" stroke="#00A8C7" stroke-width="2"/><circle cx="96" cy="193" r="20" fill="#0B334C"/><text x="96" y="199" fill="#FFFFFF" text-anchor="middle" font-size="14">01</text><text x="130" y="188">Product fit and requirements</text><text x="130" y="212" font-size="13" font-weight="400" fill="#506575">User problem · baseline · success measures</text>
    <rect x="64" y="246" width="772" height="78" rx="15" fill="#EAF8FB" stroke="#00A8C7" stroke-width="2"/><circle cx="96" cy="285" r="20" fill="#0B334C"/><text x="96" y="291" fill="#FFFFFF" text-anchor="middle" font-size="14">02</text><text x="130" y="280">How LLMs work</text><text x="130" y="304" font-size="13" font-weight="400" fill="#506575">Tokens · context · sampling · variability</text>
    <rect x="64" y="338" width="772" height="78" rx="15" fill="#EAF8FB" stroke="#00A8C7" stroke-width="2"/><circle cx="96" cy="377" r="20" fill="#0B334C"/><text x="96" y="383" fill="#FFFFFF" text-anchor="middle" font-size="14">03</text><text x="130" y="372">Model selection and integration</text><text x="130" y="396" font-size="13" font-weight="400" fill="#506575">Hosted APIs · open weights · provider boundary</text>
    <rect x="64" y="430" width="772" height="78" rx="15" fill="#EAF8FB" stroke="#00A8C7" stroke-width="2"/><circle cx="96" cy="469" r="20" fill="#0B334C"/><text x="96" y="475" fill="#FFFFFF" text-anchor="middle" font-size="14">04</text><text x="130" y="464">Prompt, context and interaction design</text><text x="130" y="488" font-size="13" font-weight="400" fill="#506575">Schemas · streaming · uncertainty · feedback</text>
    <rect x="64" y="522" width="772" height="78" rx="15" fill="#EAF8FB" stroke="#00A8C7" stroke-width="2"/><circle cx="96" cy="561" r="20" fill="#0B334C"/><text x="96" y="567" fill="#FFFFFF" text-anchor="middle" font-size="14">05</text><text x="130" y="556">Knowledge and retrieval</text><text x="130" y="580" font-size="13" font-weight="400" fill="#506575">Source quality · search · citations · abstention</text>
    <rect x="64" y="614" width="772" height="78" rx="15" fill="#EAF8FB" stroke="#00A8C7" stroke-width="2"/><circle cx="96" cy="653" r="20" fill="#0B334C"/><text x="96" y="659" fill="#FFFFFF" text-anchor="middle" font-size="14">06</text><text x="130" y="648">Tools and workflows</text><text x="130" y="672" font-size="13" font-weight="400" fill="#506575">Validated tools · deterministic flows · agent limits</text>
    <rect x="64" y="706" width="772" height="78" rx="15" fill="#EAF8FB" stroke="#00A8C7" stroke-width="2"/><circle cx="96" cy="745" r="20" fill="#0B334C"/><text x="96" y="751" fill="#FFFFFF" text-anchor="middle" font-size="14">07</text><text x="130" y="740">Evaluation and experimentation</text><text x="130" y="764" font-size="13" font-weight="400" fill="#506575">Fixed cases · component metrics · regression</text>
    <rect x="64" y="798" width="772" height="78" rx="15" fill="#EAF8FB" stroke="#00A8C7" stroke-width="2"/><circle cx="96" cy="837" r="20" fill="#0B334C"/><text x="96" y="843" fill="#FFFFFF" text-anchor="middle" font-size="14">08</text><text x="130" y="832">Data privacy and governance</text><text x="130" y="856" font-size="13" font-weight="400" fill="#506575">Data flows · minimization · approval · retention</text>
    <rect x="64" y="890" width="772" height="78" rx="15" fill="#EAF8FB" stroke="#00A8C7" stroke-width="2"/><circle cx="96" cy="929" r="20" fill="#0B334C"/><text x="96" y="935" fill="#FFFFFF" text-anchor="middle" font-size="14">09</text><text x="130" y="924">AI security and safety</text><text x="130" y="948" font-size="13" font-weight="400" fill="#506575">Prompt injection · least privilege · safe boundaries</text>
    <rect x="64" y="982" width="772" height="78" rx="15" fill="#EAF8FB" stroke="#00A8C7" stroke-width="2"/><circle cx="96" cy="1021" r="20" fill="#0B334C"/><text x="96" y="1027" fill="#FFFFFF" text-anchor="middle" font-size="14">10</text><text x="130" y="1016">Cost, performance and operations</text><text x="130" y="1040" font-size="13" font-weight="400" fill="#506575">Latency · budgets · monitoring · release · rollback</text>
  </g>
  <rect x="175" y="1100" width="550" height="56" rx="28" fill="#0B334C"/>
  <text x="450" y="1135" fill="#FFFFFF" text-anchor="middle" font-size="17" font-weight="700">Capstone: operate the evaluated support assistant</text>
  <line x1="42" y1="1190" x2="858" y2="1190" stroke="#DCEAF1"/>
  <text x="42" y="1218" font-size="12" fill="#506575">Each stage adds a verified milestone to the same synthetic practice app.</text>
  <text x="858" y="1218" font-size="12" fill="#0B334C" font-weight="700" text-anchor="end">Techversant Center of Excellence</text>
</svg>
