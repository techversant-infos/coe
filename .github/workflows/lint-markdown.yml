name: Lint Markdown

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.github/workflows/lint-markdown.yml'
      - '.github/linters/**'
      - '.github/scripts/**'
      - 'cspell.json'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - '.github/workflows/lint-markdown.yml'
      - '.github/linters/**'
      - '.github/scripts/**'
      - 'cspell.json'
  workflow_dispatch:

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Rules and ignored folders live in .github/linters/.markdownlint-cli2.jsonc
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: '.github/linters/.markdownlint-cli2.jsonc'
          globs: '**/*.md'

  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check spelling in Markdown
        uses: streetsidesoftware/cspell-action@v9
        with:
          files: '**/*.md'
          config: './cspell.json'
          incremental_files_only: true

  relative-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check relative links and legacy paths
        run: python3 .github/scripts/check-links.py

  links-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Skipped URLs: local dev servers in exercises, and sites that reject automated requests
      # (checked by hand in a browser on 2026-10-28). The technical-writer skill is a page of placeholder templates.
      - name: Lychee Link Check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude '^https?://localhost'
            --exclude '^https://helpx\.adobe\.com/'
            --exclude '^https://platform\.openai\.com/'
            --exclude-path ai/skills-library/technical-writer/SKILL.md
            '**/*.md'
          fail: true
